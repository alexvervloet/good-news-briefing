name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12"]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
          cache-dependency-path: |
            requirements.txt
            pyproject.toml

      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[test]" ruff

      - name: Lint (ruff)
        run: ruff check .

      # Unit tests mock the LLM at its boundary, so no model or network is
      # needed — the eval suite (which does need a live model) is not run in CI.
      - name: Test (pytest)
        run: pytest
